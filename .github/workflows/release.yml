name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify annotated release source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          git fetch origin main
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{}")"
          git merge-base --is-ancestor HEAD origin/main
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
      - run: npm ci
        working-directory: plugins/token-monitor-embedded
      - run: node scripts/build-release.mjs --target all
      - name: Inspect every target and execute the host package
        run: |
          for target in macos-arm64 macos-x64 windows-x64 windows-arm64; do
            node scripts/test-package.mjs --target "$target"
          done
      - name: Prepare draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 --verify-tag --draft --title "TokenMonitor ${RELEASE_TAG#v}" --notes-file docs/RELEASE-1.4.0.md
