name: CI
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2025
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TOKENMONITOR_TEST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          architecture: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: plugins/token-monitor-embedded
      - run: npm install --global @openai/codex@0.163.0
      - run: node scripts/build-release.mjs --target ${{ matrix.target }}
      - run: node scripts/test-package.mjs --target ${{ matrix.target }}
      - run: python scripts/test_release_install.py
      - run: python scripts/test_embedded_hook_discovery.py
  report:
    needs: validate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish protected-branch status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.validate.result }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" -f state="$state" -f context=validated-build -f description="Platform build, tests and package validation: $RESULT" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
